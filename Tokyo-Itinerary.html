inza Station (multiple lines)."},weather:{avgHigh:27,avgLow:20,condition:"Warm & Humid",tip:"Early June can have rainy season (tsuyu). Pack a compact umbrella and light breathable layers."}},yh=[{id:1,date:"June 13",dayOfWeek:"Saturday",theme:"Arrival & Ginza",emoji:"✈️",color:"#C41E3A",activities:[{time:"Morning",timeRange:"6:00 AM – 12:00 PM",icon:"✈️",title:"Fly to Tokyo",description:"Board your flight to Tokyo Narita (NRT) or Haneda (HND). Settle in, hydrate well, and enjoy the journey.",tips:"Download offline Google Maps for Tokyo before boarding. Get JPY cash at the airport ATM (7-Eleven ATMs accept foreign cards).",type:"travel"},{time:"Afternoon",timeRange:"1:00 PM – 4:00 PM",icon:"🚆",title:"Transfer to Grand Ginza Hotel",description:"Take the Narita Express (N'EX) or Keikyu Line from Haneda to central Tokyo. Check in at Grand Ginza Hotel.",tips:"Buy a Suica or Pasmo IC card at the airport — it works on all trains, buses, and even vending machines.",type:"transport"},{time:"Late Afternoon",timeRange:"4:00 PM – 6:00 PM",icon:"🛍️",title:"Explore Ginza",description:"Take a leisurely stroll down Chuo-dori. Window shop at flagship stores like Mikimoto, Hermès, and the iconic Itoya stationery store (12 floors!).",tips:"On Saturdays, Chuo-dori becomes a pedestrian-only street (hokousha tengoku) from 3–6 PM.",type:"sightseeing",mapQuery:"Ginza+Tokyo",coords:[35.67,139.7647]},{time:"Evening",timeRange:"7:00 PM – 9:00 PM",icon:"🍢",title:"Welcome Dinner — Yurakucho Yakitori Alley (有楽町ガード下)",description:"An 8-minute walk from the hotel under the JR Yurakucho train tracks lies one of Tokyo's most atmospheric dining strips. Dozens of tiny yakitori stalls and izakayas crammed together, with smoke, noise, and cold beer. Featured by Paolo from TOKYO as a must-do first-night experience.",tips:"⭐ Paolo from TOKYO top pick. Sit at a counter bar, order yakitori skewers (tare or shio), edamame, and a nama beer. Budget ¥2,000–3,000. No reservation needed — just walk in.",type:"dining",mapQuery:"Yurakucho+Yakitori+Alley+Tokyo",coords:[35.6752,139.7638],highlight:!0}]},{id:2,date:"June 14",dayOfWeek:"Sunday",theme:"Asakusa, Kappabashi & Tokyo Skytree",emoji:"⛩️",color:"#8B1A1A",activities:[{time:"Morning",timeRange:"7:00 AM – 9:00 AM",icon:"⛩️",title:"Senso-ji Temple (Asakusa)",description:"Visit Tokyo's oldest and most famous temple before the crowds arrive. Walk through Kaminarimon (Thunder Gate), Nakamise shopping street, and the main hall.",tips:"Arrive before 8 AM for a peaceful experience. Draw your fortune (omikuji) for ¥100 — tie bad fortunes to the rack nearby.",type:"sightseeing",mapQuery:"Senso-ji+Temple+Asakusa+Tokyo",coords:[35.7147,139.7966],highlight:!0},{time:"Mid-Morning",timeRange:"9:00 AM – 11:00 AM",icon:"🛒",title:"Nakamise Shopping Street",description:"Browse 89 traditional shops selling ningyo-yaki cakes, ningyo dolls, yukatas, and Japanese snacks. Perfect for omiyage (souvenir) shopping.",tips:"Try ningyo-yaki (red bean cake shaped like a doll) and kaminari-okoshi (rice crackers) — Asakusa specialties.",type:"shopping",mapQuery:"Nakamise+Dori+Asakusa",coords:[35.7143,139.7967]},{time:"Late Morning",timeRange:"11:00 AM – 12:00 PM",icon:"🔪",title:"Kappabashi Kitchen Town (合羽橋道具街)",description:"A 10-minute walk from Senso-ji brings you to Kappabashi Dori — 200+ professional kitchen supply shops. Browse gleaming knives, handmade ceramics, lacquerware, and hyper-realistic plastic food replicas (a Tokyo icon in themselves). Featured by Paolo from TOKYO and Abroad in Japan.",tips:"⭐ Paolo from TOKYO top pick. The plastic food replicas (sampuru) make hilarious gifts. A good Japanese kitchen knife from here starts at ¥3,000 and will last decades.",type:"shopping",mapQuery:"Kappabashi+Kitchen+Town+Tokyo",coords:[35.7178,139.7939],highlight:!0},{time:"Afternoon",timeRange:"12:00 PM – 3:00 PM",icon:"🗼",title:"Tokyo Skytree",description:"From Kappabashi, it's about a 20-minute walk back through Asakusa and across the Sumida River via Azuma Bridge to reach Skytree — or hop on the Tobu Skytree Line from Asakusa Station for a quick one-stop, 3-minute ride. Once there, ascend the world's tallest broadcast tower (634m). The Tembo Deck (350m) and Tembo Galleria (450m) offer breathtaking 360° views of Tokyo.",tips:"Book tickets online in advance to skip the queue. On clear days you can see Mt. Fuji to the west.",type:"sightseeing",mapQuery:"Tokyo+Skytree",coords:[35.7101,139.8107],highlight:!0},{time:"Afternoon",timeRange:"3:00 PM – 5:00 PM",icon:"🍡",title:"Lunch & Sumida River Walk",description:"Lunch at the Skytree mall (Solamachi) — over 300 shops and restaurants. Then take a scenic walk along the Sumida River.",tips:"Try a ramen or tempura set at Solamachi's 6th floor restaurant zone.",type:"dining"},{time:"Evening",timeRange:"6:00 PM – 9:00 PM",icon:"🍻",title:"Asahi Beer Hall & Hoppy Street",description:`Head back across Azuma Bridge into Asakusa — an easy 20-minute walk along the river, or a quick one-stop ride on the Tobu line — and dine at one of Asakusa's famous izakayas on Hoppy Street, just steps from Asakusa Station. The golden "poo" sculpture atop the Asahi building (visible from the bridge) is Tokyo's quirkiest landmark.`,tips:"Order hoppy (low-alcohol barley drink) and yakitori grilled skewers — Asakusa's local tradition since the 1940s.",type:"dining",mapQuery:"Hoppy+Street+Asakusa+Tokyo",coords:[35.7112,139.7938]}]},{id:3,date:"June 15",dayOfWeek:"Monday",theme:"Hakone Getaway — Day 1 (Overnight)",emoji:"🗻",color:"#3F6B5C",activities:[{time:"Early Morning",timeRange:"7:00 AM – 8:11 AM",icon:"🚄",title:"Depart for Hakone",description:"Pack an overnight bag and head to Shinjuku Station to board the Odakyu Romancecar bound for Hakone-Yumoto, departing at 8:11 AM. The reserved-seat limited express takes about 85 minutes through the mountains toward Mt. Fuji country.",tips:"Grab a coffee and an onigiri at the station before boarding — book the panoramic forward-facing seats up front if available.",type:"travel",mapQuery:"Shinjuku+Station+Odakyu+Romancecar",coords:[35.6896,139.6917],highlight:!0},{time:"Morning",timeRange:"9:36 AM – 9:45 AM",icon:"🧳",title:"Send Luggage Ahead — Station-to-Hotel Delivery",description:"The moment you arrive at Hakone-Yumoto Station, look for the luggage forwarding counter — it's in the station's main concourse near the Tourist Information desk, right by the entrance to the Hakone Tozan department store / souvenir plaza just outside the ticket gates. Hand over your overnight bags here for same-day delivery straight to Hoshino Resort KAI Hakone — they'll be waiting in your room by check-in time.",tips:"🧳 Don't skip this — it's a small fee per bag (roughly ¥500–1,000) and frees you to explore the museum, ropeway, and lake cruise hands-free all day. Keep a small day bag with anything you'll need before evening (camera, wallet, layers, swimsuit for the onsen, cash for snacks).",type:"travel",mapQuery:"Hakone+Yumoto+Station+Tourist+Information+Center",coords:[35.2269,139.0582],highlight:!0},{time:"Mid-Morning",timeRange:"9:45 AM – 11:30 AM",icon:"🎨",title:"Hakone Open-Air Museum (彫刻の森美術館)",description:"Japan's first open-air museum spreads Picasso, Henry Moore, and Japanese sculpture across forested hillside grounds, with a dedicated Picasso pavilion and a stained-glass Symphonic Sculpture tower you can climb.",tips:"A short walk from Chokoku-no-Mori Station (one stop from Hakone-Yumoto on the Hakone Tozan Line). Budget 1.5–2 hours; the open-air hot-spring foot bath inside is a nice mid-visit break.",type:"culture",mapQuery:"Hakone+Open+Air+Museum",coords:[35.2352,139.0284],highlight:!0},{time:"Late Morning",timeRange:"11:30 AM – 12:00 PM",icon:"🚞",title:"Hakone Tozan Train & Cable Car to Sounzan",description:"From Chokoku-no-Mori Station, continue on the Hakone Tozan Railway — Japan's oldest mountain railway, famous for its zig-zagging switchback turns up the forested slopes (and, by mid-to-late June, hydrangeas blooming right along the tracks). Ride it to the end of the line at Gora, then transfer directly to the Hakone Tozan Cable Car, a steep funicular that climbs from Gora up to Sounzan — your gateway to the ropeway and Owakudani.",tips:"🚞 Don't miss this pair — they're half the fun of getting around Hakone! Sit on the right side heading uphill for the best hydrangea views. The Hakone Free Pass covers the Tozan Train, Cable Car, Ropeway, and Pirate Ship cruise — get one at Hakone-Yumoto Station before you set off this morning.",type:"transport",mapQuery:"Hakone+Tozan+Railway+Gora+Station",coords:[35.2316,139.027],highlight:!0},{time:"Midday",timeRange:"12:00 PM – 2:00 PM",icon:"🚡",title:"Owakudani via Hakone Ropeway",description:"Ride the Hakone Ropeway over the still-steaming Owakudani volcanic valley — sulfurous vents, an otherworldly grey landscape, and (on a clear day) Mt. Fuji rising in the distance. Stop for the famous kuro-tamago (black eggs), boiled in the hot springs and said to add seven years to your life.",tips:"Lunch here — the ropeway station has noodle shops with valley views. Eat one black egg per person — legend says each adds seven years to your life!",type:"highlight",mapQuery:"Owakudani+Hakone",coords:[35.2402,139.0247],highlight:!0},{time:"Afternoon",timeRange:"2:30 PM – 4:30 PM",icon:"⛴️",title:"Lake Ashi Pirate Ship Cruise & Hakone Shrine",description:`Continue down the ropeway to Togendai and board one of the replica "pirate ship" sightseeing boats across Lake Ashi to Hakone-machi. From there it's a short lakeside walk to Hakone Shrine's iconic red torii gate standing in the water — one of the most photographed views in Japan, with Mt. Fuji as backdrop on clear days.`,tips:"Sit on the upper deck for the best Fuji views. The shrine's lakeside torii is busiest at sunset — arrive a little earlier to get a clean shot before the crowds build.",type:"highlight",mapQuery:"Hakone+Shrine+Lake+Ashi",coords:[35.193,139.018],highlight:!0},{time:"Late Afternoon",timeRange:"4:30 PM – 5:30 PM",icon:"🚌",title:"Back to Hakone-Yumoto",description:"From Moto-Hakone (right by the shrine), board the Hakone Tozan Bus toward Hakone-Yumoto Station — a scenic 30–40 minute ride back down through the mountains that drops you in town just a few minutes' walk from Hoshino Resort KAI Hakone.",tips:"🚌 Buses run frequently along this route and the Hakone Free Pass covers the fare — no ticket purchase needed. Grab a window seat for one last mountain view before you check in and unwind.",type:"travel",mapQuery:"Moto-Hakone+Bus+to+Hakone-Yumoto",coords:[35.2269,139.0582]},{time:"Evening",timeRange:"5:30 PM – 7:00 PM",icon:"♨️",title:"Check-In at Hoshino Resort KAI Hakone & Onsen Soak",description:"Check into Hoshino Resort KAI Hakone, a modern ryokan along the Sukumogawa River known for its hinoki-cypress open-air baths and contemporary take on traditional hospitality, and unwind in its natural hot-spring onsen — Hakone is one of Japan's most famous hot-spring towns, fed by the same volcanic activity you saw at Owakudani.",tips:"Wash thoroughly before entering the bath. If you have tattoos, check KAI Hakone's policy ahead of time — you may need a private (kashikiri) bath. 💆 If you'd like a massage or other spa treatment during your stay, ask at check-in — slots are limited and book up fast.",type:"sightseeing",mapQuery:"Hoshino+Resort+KAI+Hakone",coords:[35.2237,139.0585]},{time:"Evening",timeRange:"7:30 PM – 9:00 PM",icon:"🍱",title:"Kaiseki Dinner",description:"KAI Hakone's multi-course kaiseki dinner is served in a private dining area — a parade of seasonal, beautifully plated dishes featuring local Hakone ingredients like Odawara seafood and mountain vegetables.",tips:"Wear your yukata (provided by the ryokan) to dinner — it's expected and part of the experience. Save room for the rice and dessert course at the end!",type:"dining",mapQuery:"Hoshino+Resort+KAI+Hakone+Kaiseki+Dinner",coords:[35.2237,139.0585],highlight:!0},{time:"Evening",timeRange:"9:00 PM – 9:45 PM",icon:"🏮",title:'"Secrets of Hakone" — KAI Cultural Discovery',description:"Wind down the night with KAI Hakone's nightly Cultural Discovery experience — a lantern-lit lounge session that tells the story of Hakone's old shukuba post-town through the lens of yosegi-zaiku (Hakone marquetry), capped with an interactive challenge to crack open a traditional Japanese puzzle box for a hidden prize inside. Stay the night and wake up to mountain views over the river.",tips:"🧩 Want to go deeper? Ask the front desk about booking the ~45-minute hands-on marquetry workshop (you take home a photo frame decorated with your own inlay pattern), and stop by the adjoining KAI shop for genuine Hakone marquetry crafts — both pair perfectly with tonight's show.",type:"culture",mapQuery:"Hoshino+Resort+KAI+Hakone",coords:[35.2237,139.0585],highlight:!0}]},{id:4,date:"June 16",dayOfWeek:"Tuesday",theme:"Hakone Morning & Return to Shinjuku",emoji:"🚄",color:"#1A3A6B",activities:[{time:"Morning",timeRange:"8:00 AM – 9:30 AM",icon:"🍵",title:"KAI Hakone Breakfast & Morning Onsen",description:"Start the day slowly with a traditional Japanese breakfast at Hoshino Resort KAI Hakone (grilled fish, rice, miso soup, pickles) and one more relaxed soak in the onsen before checking out.",tips:"Mornings are the quietest time at the baths — a great chance for one last soak before the day gets going.",type:"sightseeing",mapQuery:"Hoshino+Resort+KAI+Hakone",coords:[35.2237,139.0585]},{time:"Late Morning",timeRange:"10:00 AM – 12:00 PM",icon:"🌳",title:"Gora Park & Hakone Museum of Art",description:"After breakfast, ride the Hakone Tozan Railway from Hakone-Yumoto to Gora — the same scenic switchback line from yesterday, about 40 minutes end to end. Spend a relaxed morning exploring Gora — a French-style garden with a tropical greenhouse and seasonal flowers — plus the moss-garden grounds of the Hakone Museum of Art, both an easy walk from Gora Station. A gentle, scenic way to spend your last hours in the mountains.",tips:"When you're ready for lunch, simply ride the Tozan Railway back down to Hakone-Yumoto (~40 min) — note that the Cable Car only runs the *other* direction, up toward Sounzan and the ropeway, so it won't help on the way back.",type:"sightseeing",mapQuery:"Gora+Park+Hakone",coords:[35.2317,139.0326]},{time:"Midday",timeRange:"12:00 PM – 2:00 PM",icon:"🍜",title:"Lunch — Hakone Kamameshi Soba (箱根釜めしそば)",description:"A beloved Hakone-Yumoto institution serving kamameshi (rice cooked in an individual iron pot) alongside handmade soba — a regional combination unique to this mountain town. Rich, savoury rice with seasonal mountain vegetables and earthy buckwheat noodles made a perfect final meal before heading back to Tokyo.",tips:"Kamameshi takes a little time to cook — order as soon as you sit. The set meals combining soba and kamameshi are the way to go.",type:"dining",mapQuery:"Hakone+Kamameshi+Soba+Hakone-Yumoto",coords:[35.2269,139.058]},{time:"Afternoon",timeRange:"2:00 PM – 5:00 PM",icon:"🛍️",title:"Hakone-Yumoto Souvenir Shopping & Last Soak",description:"Wander the souvenir shops along Hakone-Yumoto's main street for yosegi-zaiku (traditional marquetry woodwork), local sweets, and hot-spring bath salts. If your ryokan offers late checkout, sneak in one final onsen soak before the journey home.",tips:"Yosegi-zaiku puzzle boxes make great omiyage (gifts) — look for ones made in nearby Odawara, the craft's home region.",type:"shopping",mapQuery:"Hakone+Yumoto+Shopping+Street",coords:[35.2265,139.0575]},{time:"Late Afternoon",timeRange:"5:46 PM – 7:26 PM",icon:"🚄",title:"Romancecar Back to Shinjuku",description:"Board the Odakyu Romancecar departing Hakone-Yumoto at 5:46 PM, arriving at Shinjuku Station at 7:26 PM. Sit back and enjoy the mountain-to-city transition as Tokyo's skyline comes back into view.",tips:"Reserve your seat in advance for this leg — early-evening Romancecars back to Tokyo can fill up, especially on weekdays.",type:"travel",mapQuery:"Hakone+Yumoto+Station+Romancecar",coords:[35.6896,139.6917],highlight:!0},{time:"Evening",timeRange:"7:30 PM – 10:00 PM",icon:"🍶",title:"Dinner — Omoide Yokocho + Golden Gai",description:"Since you're already in Shinjuku, cap off the trip back with Omoide Yokocho (Memory Lane) — a cramped alley of yakitori stalls pouring smoke into the air since the 1940s — then Golden Gai: 200+ tiny bars (each seating ~5), each with its own theme and character. Chris Broad (Abroad in Japan) calls this his single favorite place in Tokyo.",tips:"⭐ Chris Broad's #1 pick in all of Japan. Golden Gai cover fees (¥500–1,000) are normal — ask before entering. Order a whisky highball, canned chu-hi, or local craft beer. Budget ¥1,500–2,500 per bar. From here it's about a 35-minute ride on the Marunouchi + Ginza Lines back to the hotel.",type:"dining",mapQuery:"Golden+Gai+Shinjuku+Tokyo",coords:[35.6934,139.6997],highlight:!0}]},{id:5,date:"June 17",dayOfWeek:"Wednesday",theme:"Yanaka Old Town & Akihabara",emoji:"🏮",color:"#2D6A4F",activities:[{time:"Morning",timeRange:"9:00 AM – 11:00 AM",icon:"🎨",title:"Tokyo National Museum (Ueno)",description:"Japan's largest and oldest national museum houses over 110,000 works. Highlights: samurai armor, ancient pottery, Buddhist sculptures, and ukiyo-e woodblock prints.",tips:"Focus on the Honkan (main building) for Japanese art and the Hyokeikan for ancient artifacts. ¥1,000 entry.",type:"culture",mapQuery:"Tokyo+National+Museum+Ueno",coords:[35.7189,139.7757],highlight:!0},{time:"Late Morning",timeRange:"11:00 AM – 12:30 PM",icon:"🏮",title:"Yanaka Ginza Shopping Street (谷中銀座)",description:"A 10-minute walk from Ueno takes you to Yanaka — Tokyo's best-preserved pre-war neighborhood. Yanaka Ginza is a 170m shopping street of small family shops selling traditional snacks, ceramics, and local crafts. The old cemetery, narrow alleys, and wooden houses feel like old-town Showa-era Japan. Featured extensively by Abroad in Japan and Tokyo Lens.",tips:'⭐ Abroad in Japan top pick for "real Tokyo." Try menchi-katsu (fried meat patty), taiyaki (fish-shaped cake), and fresh-cut melon. The area has almost zero tourists — very authentic.',type:"sightseeing",mapQuery:"Yanaka+Ginza+Tokyo",coords:[35.7272,139.7635],highlight:!0},{time:"Midday",timeRange:"12:30 PM – 1:30 PM",icon:"🏮",title:"Ameya-Yokocho Market & Lunch",description:"From Yanaka, it's about a 10-minute walk south to Ameya-Yokocho — a bustling open-air market strip under the JR tracks right by Ueno Station. Originally a post-war black market, it's now packed with street food stalls, making it a perfect casual lunch stop on your way toward Akihabara.",tips:"Great for affordable Japanese snacks, grilled skewers, dried seafood, and cheap cosmetics. Bargaining is sometimes possible. Eat as you browse — no need for a sit-down lunch today.",type:"shopping",mapQuery:"Ameyoko+Market+Ueno+Tokyo",coords:[35.7082,139.7742]},{time:"Afternoon",timeRange:"1:30 PM – 4:00 PM",icon:"⚡",title:"Akihabara Electric Town",description:"Continue south — Akihabara is just two stops from Okachimachi/Ueno on the JR Yamanote Line (about 5 minutes), or a 20-minute walk if you'd rather stretch your legs. Dive into Tokyo's otaku and electronics paradise: multi-floor shops sell anime figures, retro games, manga, components, and gadgets. Yodobashi Camera is a 9-floor electronics megastore.",tips:"Visit a maid café for a uniquely Japanese experience (Anna Miller's or @Home Café are popular). Mandarake Complex has 8 floors of used anime/manga goods.",type:"shopping",mapQuery:"Akihabara+Tokyo",coords:[35.7023,139.7745],highlight:!0},{time:"Late Afternoon",timeRange:"4:30 PM – 5:30 PM",icon:"⌚",title:"Audemars Piguet — AP House Watch Lab (booked)",description:"Head south toward Ginza for your booked Watch Lab appointment at the Audemars Piguet AP House boutique — about 20 minutes from Akihabara via the Hibiya or Ginza Line. A guided, hands-on look at the craftsmanship and mechanics behind their watches. Azabudai Hills is your next stop — a quick 8-minute hop on the Hibiya Line from Ginza to Kamiyacho.",tips:"📞 Confirm your exact appointment time and arrive a few minutes early.",type:"highlight",mapQuery:"Audemars+Piguet+AP+House+Ginza+Tokyo",coords:[35.6722,139.767],highlight:!0},{time:"Evening",timeRange:"5:45 PM – 7:30 PM",icon:"🏙️",title:"Azabudai Hills (麻布台ヒルズ)",description:`From Ginza, take the Hibiya Line one stop to Kamiyacho (8 min) to reach Azabudai Hills — Mori Building's stunning 2023 "urban village" development anchored by Japan's tallest tower. Explore the ground-level Garden Plaza with its 320+ plant species, browse the Azabudai Hills Gallery for contemporary art, and soak in the architecture. Honest tip from real visitors: this is a beautiful 2-hour browse, not a full day — the gardens, gallery, and market stalls are the highlights.`,tips:"Navigate using the B1 underground concourse to avoid getting lost in the tower lobbies. The food market stalls (ground floor) are excellent for a pre-dinner snack. Restaurants fill up fast — if you have a dinner reservation, honour the time.",type:"sightseeing",mapQuery:"Azabudai+Hills+Tokyo",coords:[35.6577,139.7424]},{time:"Evening",timeRange:"7:30 PM – 9:30 PM",icon:"🍢",title:"Dinner at Toriyoshi (鳥与志)",description:"A 10-minute walk from Kamiyacho brings you to Toriyoshi, a beloved yakitori counter in Toranomon. From the prestigious Torishiki lineage, it serves charcoal-grilled skewers in the style Tokyo locals swear by — crispy tsukune, perfectly rendered thigh, silky liver, rich skin. Counter seating only, with an authentic salaryman atmosphere that feels nothing like a tourist spot. Budget ¥2,500–4,000 per person with drinks.",tips:"Walk-ins welcome but arrive by 6 PM to snag a counter seat — it fills fast after 7 PM. You can also call ahead to reserve. From Toriyoshi, head back to Kamiyacho station and take the Hibiya Line one stop to Higashi-Ginza (10 min).",type:"dining",mapQuery:"鳥与志+虎ノ門",coords:[35.6695,139.751],highlight:!0}]},{id:6,date:"June 18",dayOfWeek:"Thursday",theme:"Shibuya, Harajuku & Omotesando",emoji:"🏙️",color:"#3D2B6B",activities:[{time:"Morning",timeRange:"8:30 AM – 9:00 AM",icon:"🚇",title:"Travel to Harajuku",description:"From Higashi-Ginza Station, take the Tokyo Metro Ginza Line west to Shibuya (~25 min), then switch to the Yamanote Line one stop north to Harajuku Station. Walk a few minutes through the Omotesando gate to reach Meiji Jingu.",tips:"Suica/IC card works seamlessly across both lines. Total fare under ¥300.",type:"transport",mapQuery:"Harajuku+Station+Tokyo",coords:[35.6703,139.7026]},{time:"Morning",timeRange:"9:00 AM – 10:30 AM",icon:"⛩️",title:"Meiji Jingu Shrine (明治神宮)",description:"A vast forested Shinto shrine dedicated to Emperor Meiji and Empress Shoken, set within 175 acres of woodland in the heart of Tokyo. Follow the wide gravel path through towering torii gates to the main shrine compound. June is iris season — the inner garden has spectacular blooms.",tips:"Free admission to the main shrine. The Inner Garden (¥500) is worth it in June for the iris display. One of the most serene spots in all of Tokyo despite being right in the city.",type:"culture",mapQuery:"Meiji+Jingu+Shrine+Tokyo",coords:[35.6763,139.6993],highlight:!0},{time:"Late Morning",timeRange:"10:30 AM – 12:00 PM",icon:"🛍️",title:"Harajuku / Takeshita Street (竹下通り)",description:"Exit Meiji Jingu to the east and step into a completely different world — Takeshita Street is a narrow, carnival-like pedestrian lane packed with Japanese pop fashion, kawaii accessories, crêpe stands, and street snacks. Great for people-watching and quirky souvenir shopping.",tips:"Try a rainbow crêpe from one of the street stands — a quintessential Harajuku experience. Then head down to Omotesando for the upscale contrast.",type:"shopping",mapQuery:"Takeshita+Street+Harajuku+Tokyo",coords:[35.6716,139.7034]},{time:"Midday",timeRange:"12:00 PM – 1:30 PM",icon:"🍜",title:"Omotesando & Lunch — Afuri (阿夫利)",description:"Stroll Tokyo's most elegant boulevard lined with world-class flagship boutiques and Tadao Ando's Omotesando Hills. For lunch, Afuri in Harajuku is a Tokyo cult favourite — their signature yuzu shio ramen is light, citrus-forward, and beautifully presented, the kind of bowl that serious food lovers talk about.",tips:"Order the yuzu shio ramen (~¥1,300–1,600) with extra chashu. Omotesando Hills' basement food floors (B2/B3) are a great casual alternative if Afuri has a long wait.",type:"dining",mapQuery:"Afuri+Ramen+Harajuku+Tokyo",coords:[35.6695,139.7026],highlight:!0},{time:"Afternoon",timeRange:"1:30 PM – 2:30 PM",icon:"🚦",title:"Shibuya Crossing (渋谷スクランブル交差点)",description:"Walk from Omotesando to Shibuya (~20 min) or take the Ginza/Hanzomon Line one stop. The Shibuya Scramble — the world's busiest pedestrian crossing — releases up to 3,000 people at once from all directions. View it from above at the Magnet by Shibuya109 rooftop terrace (Level 6, free), then cross it yourself at ground level.",tips:"The Starbucks overlooking the crossing is always packed but iconic for the view. Cross it at least once — the choreography of thousands of people moving in all directions simultaneously is something to witness.",type:"highlight",mapQuery:"Shibuya+Crossing+Tokyo",coords:[35.6595,139.7004],highlight:!0},{time:"Afternoon",timeRange:"2:30 PM – 4:00 PM",icon:"🌆",title:"Shibuya Sky (渋谷スカイ)",description:"Head to Shibuya Scramble Square — the 47-story tower directly above the crossing — for Shibuya Sky, Tokyo's most dramatic open-air rooftop observatory at 229m. Net-covered catwalks let you look straight down at the city below. On clear afternoons, Mt. Fuji is visible to the west.",tips:"⚠️ Book timed-entry tickets in advance at shibuya-sky.jp — ¥2,000 per person, and these sell out weeks ahead. The 45th-floor indoor lounge has drinks and a gift shop.",type:"sightseeing",mapQuery:"Shibuya+Sky+Observatory+Tokyo",coords:[35.658,139.702],highlight:!0},{time:"Late Afternoon",timeRange:"4:00 PM – 7:00 PM",icon:"🌿",title:"Daikanyama & Nakameguro Canal (代官山・中目黒)",description:"Walk south from Shibuya (~20 min) or take the Tokyu Toyoko Line one stop to Daikanyama. Browse the beautiful T-Site bookstore and lifestyle complex, then follow the Meguro River canal walk toward Nakameguro — a tree-lined path flanked by independent cafes, galleries, and boutiques. The canal flows naturally into Ebisu, putting you perfectly placed for dinner.",tips:"Nakameguro is arguably Tokyo's most atmospheric neighbourhood for an evening stroll. The walk from Nakameguro Station to Yoroniku in Ebisu is about 10 minutes — plenty of time to browse en route.",type:"sightseeing",mapQuery:"Nakameguro+Canal+Tokyo",coords:[35.6485,139.6979]},{time:"Evening",timeRange:"7:15 PM – 9:30 PM",icon:"🥩",title:"Dinner — Yoroniku (酔肉) (booked)",description:"Your reserved dinner is at Yoroniku, one of Tokyo's most celebrated yakiniku restaurants — Michelin-starred wagyu grilled tableside over charcoal, with expertly sourced cuts and house sauces. A perfect high-low contrast: the accessible energy of Shibuya all day, capped off by one of the most refined meals in Tokyo.",tips:"📞 Reservation confirmed for 7:15 PM — arrive on time, tables turn quickly. Dress neatly; this is one of the most refined dining experiences on the trip. Premium wagyu omakase courses run well above typical yakiniku prices.",type:"dining",mapQuery:"Yoroniku+Tokyo",coords:[35.6471,139.7154],highlight:!0}]},{id:7,date:"June 19",dayOfWeek:"Friday",theme:"Odaiba & teamLab",emoji:"🤖",color:"#1A4A7A",activities:[{time:"Morning",timeRange:"9:00 AM – 10:00 AM",icon:"🌉",title:"Odaiba Waterfront",description:"Take the driverless Yurikamome monorail from Shimbashi over Rainbow Bridge to the futuristic artificial island of Odaiba. Walk the waterfront with views of the Rainbow Bridge and a replica Statue of Liberty.",tips:"The monorail ride itself is a highlight — sit at the front for a driver's-eye view. Buy a 1-day Yurikamome pass — you'll use it again to reach Toyosu this morning.",type:"sightseeing",mapQuery:"Odaiba+Tokyo",coords:[35.627,139.7756],highlight:!0},{time:"Morning",timeRange:"10:00 AM – 10:30 AM",icon:"🚝",title:"Travel to Toyosu",description:"Heads up — teamLab Planets is actually in Toyosu, a separate waterfront district from Odaiba, not the same island. Hop back on the Yurikamome toward Shin-Toyosu Station (about 15 minutes), then it's a short walk to the museum.",tips:"Your 1-day Yurikamome pass covers this leg too. Time it so you arrive a few minutes before your entry slot.",type:"transport",mapQuery:"Shin-Toyosu+Station+Tokyo",coords:[35.6447,139.7844]},{time:"Late Morning",timeRange:"10:30 AM – 12:30 PM",icon:"🚀",title:"teamLab Planets",description:"Immerse yourself in a digital art museum where you walk barefoot through expansive rooms filled with living flowers, crystal universes, and waterfall mirrors. One of Tokyo's most Instagram-worthy experiences.",tips:"BOOK TICKETS ONLINE IN ADVANCE — they sell out weeks ahead. Wear clothes you don't mind getting wet. The experience takes 1.5–2 hours.",type:"culture",mapQuery:"teamLab+Planets+Toyosu+Tokyo",coords:[35.645,139.786],highlight:!0},{time:"Afternoon",timeRange:"1:00 PM – 2:00 PM",icon:"🍱",title:"Lunch — Gyukatsu Kyoto Katsugyu (牛カツ京都勝牛)",description:"Ride the Yurikamome back toward Odaiba (about 15 minutes) and head to the 6th floor of DiverCity Tokyo Plaza for this beloved Kyoto beef-cutlet specialist — whole cuts of beef seared at high heat to a crispy crust and rare, juicy center, customizable with wasabi, sansho pepper salt, or curry sauce.",tips:"Tabelog-rated and very popular at peak lunch hours — arrive right at 1:00 to beat the rush. English menu available. ~¥2,000–5,000 per person.",type:"dining",mapQuery:"Gyukatsu+Kyoto+Katsugyu+DiverCity+Tokyo",coords:[35.6256,139.7754],highlight:!0},{time:"Afternoon",timeRange:"2:00 PM – 3:30 PM",icon:"🛍️",title:"DiverCity Tokyo & Gundam Statue",description:"Right outside the mall, visit the life-size 18m RX-78 Gundam statue, then explore Gundam Base Tokyo on the 7th floor for model kits and exclusive merchandise.",tips:"Even if you're not an anime fan, the Gundam statue is an incredible piece of engineering. Free to view from outside.",type:"sightseeing",mapQuery:"DiverCity+Gundam+Odaiba+Tokyo",coords:[35.6256,139.7754]},{time:"Late Afternoon",timeRange:"3:30 PM – 5:30 PM",icon:"🏖️",title:"Odaiba Beach & Toyota Mega Web",description:"Relax on Odaiba's man-made beach facing Tokyo Bay. Visit Toyota Mega Web (free!) to see concept cars and take test drives on a futuristic track.",tips:"The sunset view from Odaiba Beach with Rainbow Bridge and the Tokyo skyline as backdrop is spectacular.",type:"sightseeing",mapQuery:"Odaiba+Beach+Tokyo",coords:[35.627,139.776]},{time:"Evening",timeRange:"7:00 PM – 9:30 PM",icon:"🦞",title:"Dinner — Tsukiji Outer Market Area",description:"Wrap up the island portion of the day by riding the Yurikamome back to Shimbashi (about 25 minutes), then it's a short walk or one-stop subway ride to the Tsukiji Outer Market area for a fresh seafood dinner. Endless options for sushi, tamagoyaki (rolled omelette), and seafood rice bowls.",tips:"The outer market is open evenings. Sushi Dai and Daiwa Sushi are legendary (long queues, arrive early or late). Also try fresh oysters and grilled scallops at the stalls. Budget about 30 minutes for the trip over from Odaiba.",type:"dining",mapQuery:"Tsukiji+Outer+Market+Tokyo",coords:[35.6654,139.7706],highlight:!0}]},{id:8,date:"June 20",dayOfWeek:"Saturday",theme:"Farewell Day — Ginza & Departure",emoji:"🎌",color:"#4A1A1A",activities:[{time:"Morning",timeRange:"8:00 AM – 10:00 AM",icon:"☕",title:"Breakfast & Final Ginza Stroll",description:"Enjoy a final Japanese breakfast at the hotel or a nearby kissaten (traditional coffee house). Take one last walk around Ginza.",tips:"Try a morning set (morning teishoku) at a classic kissaten: toast, soft-boiled egg, and coffee for around ¥500.",type:"dining",mapQuery:"Ginza+Tokyo",coords:[35.67,139.7647]},{time:"Morning",timeRange:"10:00 AM – 11:30 AM",icon:"✏️",title:"Last-Minute Shopping — Itoya & Ginza Six",description:"Itoya stationery (12 floors!) for Japanese notebooks, washi tape, and pens. Ginza Six for luxury omiyage (gifts): Kyoto Isogiku tea, Shiroi Koibito cookies, Tokyo Banana.",tips:"Tax-free shopping (免税) is available for purchases over ¥5000 at most department stores. Bring your passport.",type:"shopping",mapQuery:"Itoya+Ginza+Tokyo",coords:[35.6705,139.7644]},{time:"Midday",timeRange:"11:30 AM – 1:00 PM",icon:"🍱",title:"Farewell Lunch — Kaneko Hannosuke Tendon",description:"Hop on the Ginza Line one stop to Mitsukoshi-mae and grab a bowl at Nihonbashi Tendon Kaneko Hannosuke — a legendary, no-reservations tendon counter serving just one dish: an Edomae-style tempura rice bowl (conger eel, prawn, squid, soft-boiled egg) with a secret family sauce, for about ¥980. If the line's too long, Tenichi back in Ginza (an institution since 1930) is a great backup.",tips:"Get in line right at 11:30 to beat the midday rush — it's only 20 seats and the wait can stretch from 45 minutes to a few hours at peak times. Cash preferred, no reservations.",type:"dining",mapQuery:"Nihonbashi+Tendon+Kaneko+Hannosuke+Tokyo",coords:[35.6834,139.7742],highlight:!0},{time:"Afternoon",timeRange:"1:30 PM – 3:30 PM",icon:"🏨",title:"Hotel Checkout & Luggage",description:"Check out from Grand Ginza Hotel. Most hotels allow you to store luggage after checkout — arrange this if your flight is in the evening.",tips:"You can also ship luggage (takuhaibin) directly to the airport via Yamato Transport (¥1500–2000 per bag, needs to be arranged the previous day).",type:"transport",mapQuery:"Grand+Ginza+Hotel+Tokyo",coords:[35.6697,139.7692]},{time:"Late Afternoon",timeRange:"4:00 PM – 6:00 PM",icon:"🚆",title:"Transfer to Narita Airport",description:"Head to Narita Airport (NRT) via the Narita Express (N'EX, ~60 min from Tokyo/Shinjuku Station) or the Keisei Skyliner (~40 min from Ueno) for your onward flight to Taipei, Taiwan. Allow at least 3 hours before an international departure.",tips:"Load remaining Suica card balance onto your phone before departure — Suica on Apple/Google Pay works internationally! Or surrender the card at the station for a ¥500 deposit refund.",type:"transport",mapQuery:"Narita+International+Airport",coords:[35.772,140.3929]},{time:"Evening",timeRange:"6:00 PM onward",icon:"✈️",title:"Departure — Tokyo (NRT) → Taipei (TPE)",description:"Board your flight from Tokyo Narita to Taipei, Taiwan — the next stop on your trip! Sayonara Tokyo, and 你好 Taipei — incredible memories of Tokyo's endless energy, kindness, food, and culture come along with you.",tips:"Check in for your Narita → Taipei flight at least 3 hours early for international departure. Confirm whether you need to surrender your IC card for a deposit refund, and grab one last conbini (convenience store) snack run before boarding!",type:"travel",mapQuery:"Narita+International+Airport+Departures",coords:[35.772,140.3929]}]}],Iv=[{icon:"💴",label:"Currency",value:"Japanese Yen (¥)",detail:"¥1 ≈ $0.0065 USD. Avg budget: ¥10,000–15,000/day for meals + activities"},{icon:"🗣️",label:"Language",value:"Japanese",detail:"English is understood in tourist areas. Google Translate camera mode is invaluable."},{icon:"🚇",label:"Getting Around",value:"Train & Metro",detail:"Suica/Pasmo IC card. Tokyo Metro 24hr pass ¥800 for unlimited subway rides."},{icon:"📶",label:"Connectivity",value:"Pocket Wi-Fi or SIM",detail:"Rent a pocket Wi-Fi at the airport or buy a tourist SIM (IIJmio, Rakuten). ¥700–1500/day."},{icon:"🏥",label:"Emergency",value:"119 (ambulance)",detail:"Police: 110. AMDA International Medical Info: 03-5285-8088 (English OK)."},{icon:"🚰",label:"Tap Water",value:"Safe to Drink",detail:"Tokyo tap water is among the cleanest in the world. Save plastic, ski
