inza",emoji:"✈️",color:"#C41E3A",activities:[{time:"Morning",timeRange:"6:00 AM – 12:00 PM",icon:"✈️",title:"Fly to Tokyo",description:"Board your flight to Tokyo Narita (NRT) or Haneda (HND). Settle in, hydrate well, and enjoy the journey.",tips:"Download offline Google Maps for Tokyo before boarding. Get JPY cash at the airport ATM (7-Eleven ATMs accept foreign cards).",type:"travel"},{time:"Afternoon",timeRange:"1:00 PM – 4:00 PM",icon:"🚆",title:"Transfer to Grand Ginza Hotel",description:"Take the Narita Express (N'EX) or Keikyu Line from Haneda to central Tokyo. Check in at Grand Ginza Hotel.",tips:"Buy a Suica or Pasmo IC card at the airport — it works on all trains, buses, and even vending machines.",type:"transport"},{time:"Late Afternoon",timeRange:"4:00 PM – 6:00 PM",icon:"🛍️",title:"Explore Ginza",description:"Take a leisurely stroll down Chuo-dori. Window shop at flagship stores like Mikimoto, Hermès, and the iconic Itoya stationery store (12 floors!).",tips:"On Saturdays, Chuo-dori becomes a pedestrian-only street (hokousha tengoku) from 3–6 PM.",type:"sightseeing",mapQuery:"Ginza+Tokyo"},{time:"Evening",timeRange:"7:00 PM – 9:00 PM",icon:"🍢",title:"Welcome Dinner — Yurakucho Yakitori Alley (有楽町ガード下)",description:"An 8-minute walk from the hotel under the JR Yurakucho train tracks lies one of Tokyo's most atmospheric dining strips. Dozens of tiny yakitori stalls and izakayas crammed together, with smoke, noise, and cold beer. Featured by Paolo from TOKYO as a must-do first-night experience.",tips:"⭐ Paolo from TOKYO top pick. Sit at a counter bar, order yakitori skewers (tare or shio), edamame, and a nama beer. Budget ¥2,000–3,000. No reservation needed — just walk in.",type:"dining",mapQuery:"Yurakucho+Yakitori+Alley+Tokyo",highlight:!0}]},{id:2,date:"June 14",dayOfWeek:"Sunday",theme:"Asakusa, Kappabashi & Tokyo Skytree",emoji:"⛩️",color:"#8B1A1A",activities:[{time:"Morning",timeRange:"7:00 AM – 9:00 AM",icon:"⛩️",title:"Senso-ji Temple (Asakusa)",description:"Visit Tokyo's oldest and most famous temple before the crowds arrive. Walk through Kaminarimon (Thunder Gate), Nakamise shopping street, and the main hall.",tips:"Arrive before 8 AM for a peaceful experience. Draw your fortune (omikuji) for ¥100 — tie bad fortunes to the rack nearby.",type:"sightseeing",mapQuery:"Senso-ji+Temple+Asakusa+Tokyo",highlight:!0},{time:"Mid-Morning",timeRange:"9:00 AM – 11:00 AM",icon:"🛒",title:"Nakamise Shopping Street",description:"Browse 89 traditional shops selling ningyo-yaki cakes, ningyo dolls, yukatas, and Japanese snacks. Perfect for omiyage (souvenir) shopping.",tips:"Try ningyo-yaki (red bean cake shaped like a doll) and kaminari-okoshi (rice crackers) — Asakusa specialties.",type:"shopping",mapQuery:"Nakamise+Dori+Asakusa"},{time:"Late Morning",timeRange:"11:00 AM – 12:00 PM",icon:"🔪",title:"Kappabashi Kitchen Town (合羽橋道具街)",description:"A 10-minute walk from Senso-ji brings you to Kappabashi Dori — 200+ professional kitchen supply shops. Browse gleaming knives, handmade ceramics, lacquerware, and hyper-realistic plastic food replicas (a Tokyo icon in themselves). Featured by Paolo from TOKYO and Abroad in Japan.",tips:"⭐ Paolo from TOKYO top pick. The plastic food replicas (sampuru) make hilarious gifts. A good Japanese kitchen knife from here starts at ¥3,000 and will last decades.",type:"shopping",mapQuery:"Kappabashi+Kitchen+Town+Tokyo",highlight:!0},{time:"Afternoon",timeRange:"12:00 PM – 3:00 PM",icon:"🗼",title:"Tokyo Skytree",description:"Ascend the world's tallest broadcast tower (634m). The Tembo Deck (350m) and Tembo Galleria (450m) offer breathtaking 360° views of Tokyo.",tips:"Book tickets online in advance to skip the queue. On clear days you can see Mt. Fuji to the west.",type:"sightseeing",mapQuery:"Tokyo+Skytree",highlight:!0},{time:"Afternoon",timeRange:"3:00 PM – 5:00 PM",icon:"🍡",title:"Lunch & Sumida River Walk",description:"Lunch at the Skytree mall (Solamachi) — over 300 shops and restaurants. Then take a scenic walk along the Sumida River.",tips:"Try a ramen or tempura set at Solamachi's 6th floor restaurant zone.",type:"dining"},{time:"Evening",timeRange:"6:00 PM – 9:00 PM",icon:"🍻",title:"Asahi Beer Hall & Hoppy Street",description:`Dine at one of Asakusa's famous izakayas on Hoppy Street. The golden "poo" sculpture atop the Asahi building is Tokyo's quirkiest landmark.`,tips:"Order hoppy (low-alcohol barley drink) and yakitori grilled skewers — Asakusa's local tradition since the 1940s.",type:"dining",mapQuery:"Hoppy+Street+Asakusa+Tokyo"}]},{id:3,date:"June 15",dayOfWeek:"Monday",theme:"Harajuku & Shibuya",emoji:"🌸",color:"#B5478A",activities:[{time:"Morning",timeRange:"8:00 AM – 10:00 AM",icon:"🌳",title:"Meiji Jingu Shrine",description:"Walk through the tranquil forested path to this grand Shinto shrine dedicated to Emperor Meiji. The 100,000-tree forest is an oasis in the city.",tips:"Follow shrine etiquette — bow twice, clap twice, bow once. The surrounding park is beautiful for a morning walk.",type:"sightseeing",mapQuery:"Meiji+Jingu+Shrine+Tokyo",highlight:!0},{time:"Late Morning",timeRange:"10:00 AM – 12:30 PM",icon:"👗",title:"Takeshita Street & Harajuku",description:"Explore Tokyo's fashion subculture hub. Takeshita-dori is lined with vintage shops, crepe stands, and wild street fashion. Pop into Ura-Harajuku's hidden boutiques.",tips:"Try a Harajuku crepe (Angelato and Marion are famous). Omotesando Hills and Laforet are great for higher-end Japanese fashion.",type:"shopping",mapQuery:"Takeshita+Street+Harajuku+Tokyo"},{time:"Afternoon",timeRange:"1:00 PM – 3:00 PM",icon:"🏙️",title:"Omotesando & Cat Street",description:"Stroll down the tree-lined Omotesando boulevard — Tokyo's Champs-Élysées. Duck into Cat Street for independent designers, cafés, and vintage stores.",tips:"Visit the Omotesando Hills complex (designed by Tadao Ando) for mid-century modern Japanese architecture.",type:"sightseeing",mapQuery:"Omotesando+Tokyo"},{time:"Afternoon",timeRange:"3:00 PM – 5:00 PM",icon:"🌊",title:"Nakameguro Canal Walk (中目黒)",description:"Take the Hibiya Line one stop from Omotesando (10 min) to Nakameguro — Tokyo's most photogenic canal walk. Tree-lined paths, indie cafés, vinyl stores, and boutiques stretch along the Meguro River. Golden hour here is stunning. Featured extensively by Tokyo Lens and Paolo from TOKYO.",tips:"⭐ Tokyo Lens top pick. The canal area is dense with coffee shops (Onibus Coffee, Starbucks Reserve Roastery), vintage vinyl stores, and local clothing brands. Great for an evening stroll.",type:"sightseeing",mapQuery:"Nakameguro+Canal+Tokyo",highlight:!0},{time:"Evening",timeRange:"5:30 PM – 7:00 PM",icon:"🚦",title:"Shibuya Crossing — The Scramble",description:"One stop on the Toyoko Line from Nakameguro (3 min) brings you to Shibuya — home of the world's most famous pedestrian crossing. The second floor of Starbucks (or the Mag's Park rooftop) offers the iconic aerial view. Featured on every Abroad in Japan and Paolo from TOKYO episode.",tips:"⭐ Abroad in Japan #1 Tokyo sight. Hit the crossing at dusk (6–7 PM) when the neon signs blaze up. Hachiko statue is 2 min away — the loyal Akita who waited 9 years.",type:"sightseeing",mapQuery:"Shibuya+Crossing+Tokyo",highlight:!0},{time:"Evening",timeRange:"7:30 PM – 9:30 PM",icon:"🍖",title:"Dinner — Gyukatsu Motomura (牛かつもと村)",description:"A Shibuya staple featured by Abroad in Japan and multiple food YouTubers. Thin-sliced rare beef katsu — cook it yourself on a small stone grill at your table to your preferred doneness. Tabelog 3.68.",tips:"⭐ Abroad in Japan recommendation. Budget ¥1,500–2,000. Queue expected but moves fast. Order the set with cabbage and barley rice. Then finish the night with drinks at Nonbei Yokocho (Drunkard's Alley) — a block of tiny atmospheric bars.",type:"dining",mapQuery:"Gyukatsu+Motomura+Shibuya+Tokyo",highlight:!0}]},{id:4,date:"June 16",dayOfWeek:"Tuesday",theme:"Shinjuku Day",emoji:"🌆",color:"#1A3A6B",activities:[{time:"Morning",timeRange:"9:00 AM – 11:00 AM",icon:"🌿",title:"Shinjuku Gyoen National Garden",description:"Wander through 144 acres of meticulously maintained gardens blending Japanese, French, and English landscaping styles. Perfect morning retreat.",tips:"Entry is ¥500. No alcohol allowed. The greenhouse has tropical plants. Arrive early for fewer crowds.",type:"sightseeing",mapQuery:"Shinjuku+Gyoen+Tokyo",highlight:!0},{time:"Late Morning",timeRange:"11:00 AM – 1:00 PM",icon:"🛍️",title:"Shinjuku Shopping",description:"Explore the vast Takashimaya Times Square, Isetan department store (try the food hall basement!), and the underground Shinjuku Station shopping arcades.",tips:"Isetan B1-B2 depachika (department store basement) is a food paradise. Grab bento sets, fresh pastries, and wagashi sweets.",type:"shopping",mapQuery:"Isetan+Shinjuku+Tokyo"},{time:"Afternoon",timeRange:"2:00 PM – 4:00 PM",icon:"🎮",title:"Kabukicho & Robot Restaurant Area",description:"Explore Tokyo's premier entertainment district. Visit the Godzilla head atop Toho Cinema, Kabukicho Tower, and browse the multi-floor arcades.",tips:"Don't miss Don Quijote (Donki) — a surreal multi-floor discount store open 24/7 with every Japanese product imaginable.",type:"sightseeing",mapQuery:"Kabukicho+Shinjuku+Tokyo"},{time:"Late Afternoon",timeRange:"4:30 PM – 5:30 PM",icon:"🏙️",title:"Tokyo Metropolitan Government Building",description:"Take the free elevator to the 45th floor observation deck (202m) for panoramic views of Tokyo. On clear days, Mt. Fuji is visible to the southwest.",tips:"Completely free! North and South towers alternate evening hours. Go before sunset for both day and twilight views.",type:"sightseeing",mapQuery:"Tokyo+Metropolitan+Government+Building",highlight:!0},{time:"Evening",timeRange:"7:00 PM – 10:00 PM",icon:"🍶",title:"Omoide Yokocho + Golden Gai",description:"Start at Omoide Yokocho (Memory Lane) — a cramped alley of yakitori stalls pouring smoke into the air since the 1940s. Then head to Golden Gai: 200+ tiny bars (each seating ~5), each with its own theme and character. Chris Broad (Abroad in Japan) calls this his single favorite place in Tokyo.",tips:"⭐ Chris Broad's #1 pick in all of Japan. Golden Gai cover fees (¥500–1,000) are normal — ask before entering. Order a whisky highball, canned chu-hi, or local craft beer. Budget ¥1,500–2,500 per bar.",type:"dining",mapQuery:"Golden+Gai+Shinjuku+Tokyo",highlight:!0}]},{id:5,date:"June 17",dayOfWeek:"Wednesday",theme:"Yanaka Old Town & Akihabara",emoji:"🏮",color:"#2D6A4F",activities:[{time:"Morning",timeRange:"9:00 AM – 11:00 AM",icon:"🎨",title:"Tokyo National Museum (Ueno)",description:"Japan's largest and oldest national museum houses over 110,000 works. Highlights: samurai armor, ancient pottery, Buddhist sculptures, and ukiyo-e woodblock prints.",tips:"Focus on the Honkan (main building) for Japanese art and the Hyokeikan for ancient artifacts. ¥1,000 entry.",type:"culture",mapQuery:"Tokyo+National+Museum+Ueno",highlight:!0},{time:"Late Morning",timeRange:"11:00 AM – 12:30 PM",icon:"🏮",title:"Yanaka Ginza Shopping Street (谷中銀座)",description:"A 10-minute walk from Ueno takes you to Yanaka — Tokyo's best-preserved pre-war neighborhood. Yanaka Ginza is a 170m shopping street of small family shops selling traditional snacks, ceramics, and local crafts. The old cemetery, narrow alleys, and wooden houses feel like old-town Showa-era Japan. Featured extensively by Abroad in Japan and Tokyo Lens.",tips:'⭐ Abroad in Japan top pick for "real Tokyo." Try menchi-katsu (fried meat patty), taiyaki (fish-shaped cake), and fresh-cut melon. The area has almost zero tourists — very authentic.',type:"sightseeing",mapQuery:"Yanaka+Ginza+Tokyo",highlight:!0},{time:"Afternoon",timeRange:"1:00 PM – 4:00 PM",icon:"⚡",title:"Akihabara Electric Town",description:"Dive into Tokyo's otaku and electronics paradise. Multi-floor shops sell anime figures, retro games, manga, components, and gadgets. Yodobashi Camera is a 9-floor electronics megastore.",tips:"Visit a maid café for a uniquely Japanese experience (Anna Miller's or @Home Café are popular). Mandarake Complex has 8 floors of used anime/manga goods.",type:"shopping",mapQuery:"Akihabara+Tokyo",highlight:!0},{time:"Late Afternoon",timeRange:"4:00 PM – 5:30 PM",icon:"🏮",title:"Ameya-Yokocho Market",description:"Wander this bustling open-air market under the JR tracks near Ueno Station. Originally a post-war black market, now packed with street food, clothing, and cosmetics.",tips:"Great for affordable Japanese snacks, dried seafood, and cheap cosmetics. Bargaining is sometimes possible.",type:"shopping",mapQuery:"Ameyoko+Market+Ueno+Tokyo"},{time:"Evening",timeRange:"6:30 PM – 9:00 PM",icon:"🍱",title:"Dinner — Tonkatsu Maisen or Ueno Izakaya",description:"Head to Maisen in Omotesando (famous tonkatsu since 1965) or enjoy an izakaya dinner with yakitori, karaage, and cold beer near Ueno.",tips:"If in the mood for budget dining, the side streets east of Ueno station have great izakayas around ¥2000–3000 per person with drinks.",type:"dining",mapQuery:"Tonkatsu+Maisen+Tokyo"}]},{id:6,date:"June 18",dayOfWeek:"Thursday",theme:"Day Trip — Kamakura",emoji:"🗿",color:"#5C4A00",activities:[{time:"Morning",timeRange:"7:30 AM – 9:30 AM",icon:"🚆",title:"Train to Kamakura",description:"Take the JR Yokosuka Line from Tokyo Station to Kamakura (about 1 hour). Purchase an Enoden 1-day pass at Kamakura Station for unlimited rides on the charming Enoshima Electric Railway.",tips:"Leave early to beat the crowds. The journey itself is scenic. Kamakura is about 50km south of Tokyo.",type:"transport",mapQuery:"Kamakura+Station"},{time:"Morning",timeRange:"9:30 AM – 11:00 AM",icon:"🗿",title:"Kotoku-in — The Great Buddha",description:"Stand before the 13.35m bronze Amida Buddha statue (1252 AD), one of Japan's most iconic images. You can enter the hollow statue for ¥20 extra.",tips:"The surrounding grounds are peaceful. Look for the sandals (donated by school children) displayed near the statue.",type:"sightseeing",mapQuery:"Kotoku-in+Great+Buddha+Kamakura",highlight:!0},{time:"Late Morning",timeRange:"11:00 AM – 12:30 PM",icon:"🌺",title:"Hase-dera Temple",description:"A short walk from the Buddha, this hillside temple has a 9.18m gilded wooden Kannon statue, a cave with hundreds of Jizo statues, and gorgeous views of Kamakura Bay.",tips:"The hydrangeas (ajisai) bloom in June — Hase-dera is one of the best spots in Japan to see them. Expect queues on weekends.",type:"sightseeing",mapQuery:"Hase-dera+Kamakura",highlight:!0},{time:"Afternoon",timeRange:"1:00 PM – 3:00 PM",icon:"⛩️",title:"Tsurugaoka Hachimangu Shrine",description:"Kamakura's most important Shinto shrine, founded in 1063. The grand approach (Dankazura) lined with cherry trees leads to the vermilion main hall.",tips:"The museum inside houses National Treasures from the Kamakura period. The pond has ducks and turtles.",type:"sightseeing",mapQuery:"Tsurugaoka+Hachimangu+Kamakura"},{time:"Afternoon",timeRange:"3:00 PM – 4:30 PM",icon:"🛍️",title:"Komachi Street Shopping",description:"Browse Kamakura's charming shopping street for local crafts, Buddhist goods, pickled plums, and matcha sweets.",tips:"Try shirasu-don (whitebait rice bowl) — Kamakura's local specialty, best at one of the many small restaurants on this street.",type:"shopping",mapQuery:"Komachi+Street+Kamakura"},{time:"Evening",timeRange:"5:30 PM – 8:00 PM",icon:"🍷",title:"Return to Tokyo — Dinner in Ginza",description:"Take the train back to Tokyo. End the day with an elegant dinner near the hotel in Ginza — try French-Japanese fusion at one of Ginza's many fine dining spots, or pick up a bento from a department store.",tips:"Ginza Six (GINZA SIX), the massive luxury mall, has a great food floor (B2) open until 9 PM.",type:"dining",mapQuery:"GINZA+SIX+Tokyo"}]},{id:7,date:"June 19",dayOfWeek:"Friday",theme:"Odaiba & teamLab",emoji:"🤖",color:"#1A4A7A",activities:[{time:"Morning",timeRange:"9:00 AM – 10:30 AM",icon:"🌉",title:"Odaiba Waterfront",description:"Take the driverless Yurikamome monorail from Shimbashi over Rainbow Bridge to the futuristic artificial island of Odaiba. Walk the waterfront with views of the Rainbow Bridge and a replica Statue of Liberty.",tips:"The monorail ride itself is a highlight — sit at the front for a driver's-eye view. Buy a 1-day Yurikamome pass.",type:"sightseeing",mapQuery:"Odaiba+Tokyo",highlight:!0},{time:"Morning",timeRange:"10:30 AM – 12:00 PM",icon:"🚀",title:"teamLab Planets",description:"Immerse yourself in a digital art museum where you walk barefoot through expansive rooms filled with living flowers, crystal universes, and waterfall mirrors. One of Tokyo's most Instagram-worthy experiences.",tips:"BOOK TICKETS ONLINE IN ADVANCE — they sell out weeks ahead. Wear clothes you don't mind getting wet. The experience takes 1.5–2 hours.",type:"culture",mapQuery:"teamLab+Planets+Toyosu+Tokyo",highlight:!0},{time:"Afternoon",timeRange:"1:00 PM – 3:30 PM",icon:"🛍️",title:"DiverCity Tokyo & Gundam Statue",description:"Visit the life-size 18m RX-78 Gundam statue outside DiverCity mall. The mall has a Gundam Base Tokyo on the 7th floor with model kits and exclusive merchandise.",tips:"Even if you're not an anime fan, the Gundam statue is an incredible piece of engineering. Free to view from outside.",type:"sightseeing",mapQuery:"DiverCity+Gundam+Odaiba+Tokyo"},{time:"Late Afternoon",timeRange:"4:00 PM – 6:00 PM",icon:"🏖️",title:"Odaiba Beach & Toyota Mega Web",description:"Relax on Odaiba's man-made beach facing Tokyo Bay. Visit Toyota Mega Web (free!) to see concept cars and take test drives on a futuristic track.",tips:"The sunset view from Odaiba Beach with Rainbow Bridge and the Tokyo skyline as backdrop is spectacular.",type:"sightseeing",mapQuery:"Odaiba+Beach+Tokyo"},{time:"Evening",timeRange:"7:00 PM – 9:30 PM",icon:"🦞",title:"Dinner — Tsukiji Outer Market Area",description:"Head to the Tsukiji Outer Market area for fresh seafood dinner. Endless options for sushi, tamagoyaki (rolled omelette), and seafood rice bowls.",tips:"The outer market is open evenings. Sushi Dai and Daiwa Sushi are legendary (long queues, arrive early or late). Also try fresh oysters and grilled scallops at the stalls.",type:"dining",mapQuery:"Tsukiji+Outer+Market+Tokyo",highlight:!0}]},{id:8,date:"June 20",dayOfWeek:"Saturday",theme:"Farewell Day — Ginza & Departure",emoji:"🎌",color:"#4A1A1A",activities:[{time:"Morning",timeRange:"8:00 AM – 10:00 AM",icon:"☕",title:"Breakfast & Final Ginza Stroll",description:"Enjoy a final Japanese breakfast at the hotel or a nearby kissaten (traditional coffee house). Take one last walk around Ginza.",tips:"Try a morning set (morning teishoku) at a classic kissaten: toast, soft-boiled egg, and coffee for around ¥500.",type:"dining",mapQuery:"Ginza+Tokyo"},{time:"Morning",timeRange:"10:00 AM – 12:00 PM",icon:"✏️",title:"Last-Minute Shopping — Itoya & Ginza Six",description:"Itoya stationery (12 floors!) for Japanese notebooks, washi tape, and pens. Ginza Six for luxury omiyage (gifts): Kyoto Isogiku tea, Shiroi Koibito cookies, Tokyo Banana.",tips:"Tax-free shopping (免税) is available for purchases over ¥5000 at most department stores. Bring your passport.",type:"shopping",mapQuery:"Itoya+Ginza+Tokyo"},{time:"Midday",timeRange:"12:00 PM – 1:00 PM",icon:"🍱",title:"Farewell Lunch",description:"A proper farewell meal — try tempura at Tenichi (a Ginza institution since 1930) or a set lunch at one of Ginza's high-end restaurants at affordable lunch prices.",tips:"Many Michelin-starred Ginza restaurants offer lunch sets for ¥3000–5000 that would cost ¥20,000+ at dinner. Last chance!",type:"dining",mapQuery:"Tenichi+Ginza+Tokyo",highlight:!0},{time:"Afternoon",timeRange:"1:30 PM – 3:30 PM",icon:"🏨",title:"Hotel Checkout & Luggage",description:"Check out from Grand Ginza Hotel. Most hotels allow you to store luggage after checkout — arrange this if your flight is in the evening.",tips:"You can also ship luggage (takuhaibin) directly to the airport via Yamato Transport (¥1500–2000 per bag, needs to be arranged the previous day).",type:"transport",mapQuery:"Grand+Ginza+Hotel+Tokyo"},{time:"Late Afternoon",timeRange:"4:00 PM – 6:00 PM",icon:"🚆",title:"Transfer to Airport",description:"Head to Narita via Narita Express (N'EX, ~60 min from Shinjuku) or to Haneda via Keikyu Line (~35 min from Shinagawa). Allow at least 3 hours before international departure.",tips:"Load remaining Suica card balance onto your phone before departure — Suica on Apple/Google Pay works internationally! Or surrender the card at the station for a ¥500 deposit refund.",type:"transport",mapQuery:"Narita+Airport+Tokyo"},{time:"Evening",timeRange:"6:00 PM onward",icon:"✈️",title:"Departure — Sayonara Tokyo!",description:"Board your flight home with incredible memories of Tokyo's endless energy, kindness, food, and culture.",tips:"Check if you need to surrender your IC card for a deposit refund. One last conbini (convenience store) stop at the airport for snacks!",type:"travel"}]}],Of=[{icon:"💴",label:"Currency",value:"Japanese Yen (¥)",detail:"¥1 ≈ $0.0065 USD. Avg budget: ¥10,000–15,000/day for meals + activities"},{icon:"🗣️",label:"Language",value:"Japanese",detail:"English is understood in tourist areas. Google Translate camera mode is invaluable."},{icon:"🚇",label:"Getting Around",value:"Train & Metro",detail:"Suica/Pasmo IC card. Tokyo Metro 24hr pass ¥800 for unlimited subway rides."},{icon:"📶",label:"Connectivity",value:"Pocket Wi-Fi or SIM",detail:"Rent a pocket Wi-Fi at the airport or buy a tourist SIM (IIJmio, Rakuten). ¥700–1500/day."},{icon:"🏥",label:"Emergency",value:"119 (ambulance)",detail:"Police: 110. AMDA International Medical Info: 03-5285-8088 (English OK)."},{icon:"🚰",label:"Tap Water",value:"Safe to Drink",detail:"Tokyo tap water is among the cleanest in the world. Save plastic, skip bottled water."},{icon:"💡",label:"Power",value:"100V / Type
