inza",emoji:"✈️",color:"#C41E3A",activities:[{time:"Morning",timeRange:"6:00 AM – 12:00 PM",icon:"✈️",title:"Fly to Tokyo",description:"Board your flight to Tokyo Narita (NRT) or Haneda (HND). Settle in, hydrate well, and enjoy the journey.",tips:"Download offline Google Maps for Tokyo before boarding. Get JPY cash at the airport ATM (7-Eleven ATMs accept foreign cards).",type:"travel"},{time:"Afternoon",timeRange:"1:00 PM – 4:00 PM",icon:"🚆",title:"Transfer to Grand Ginza Hotel",description:"Take the Narita Express (N'EX) or Keikyu Line from Haneda to central Tokyo. Check in at Grand Ginza Hotel.",tips:"Buy a Suica or Pasmo IC card at the airport — it works on all trains, buses, and even vending machines.",type:"transport"},{time:"Late Afternoon",timeRange:"4:00 PM – 6:00 PM",icon:"🛍️",title:"Explore Ginza",description:"Take a leisurely stroll down Chuo-dori. Window shop at flagship stores like Mikimoto, Hermès, and the iconic Itoya stationery store (12 floors!).",tips:"On Saturdays, Chuo-dori becomes a pedestrian-only street (hokousha tengoku) from 3–6 PM.",type:"sightseeing",mapQuery:"Ginza+Tokyo"},{time:"Evening",timeRange:"7:00 PM – 9:00 PM",icon:"🍢",title:"Welcome Dinner — Yurakucho Yakitori Alley (有楽町ガード下)",description:"An 8-minute walk from the hotel under the JR Yurakucho train tracks lies one of Tokyo's most atmospheric dining strips. Dozens of tiny yakitori stalls and izakayas crammed together, with smoke, noise, and cold beer. Featured by Paolo from TOKYO as a must-do first-night experience.",tips:"⭐ Paolo from TOKYO top pick. Sit at a counter bar, order yakitori skewers (tare or shio), edamame, and a nama beer. Budget ¥2,000–3,000. No reservation needed — just walk in.",type:"dining",mapQuery:"Yurakucho+Yakitori+Alley+Tokyo",highlight:!0}]},{id:2,date:"June 14",dayOfWeek:"Sunday",theme:"Asakusa, Kappabashi & Tokyo Skytree",emoji:"⛩️",color:"#8B1A1A",activities:[{time:"Morning",timeRange:"7:00 AM – 9:00 AM",icon:"⛩️",title:"Senso-ji Temple (Asakusa)",description:"Visit Tokyo's oldest and most famous temple before the crowds arrive. Walk through Kaminarimon (Thunder Gate), Nakamise shopping street, and the main hall.",tips:"Arrive before 8 AM for a peaceful experience. Draw your fortune (omikuji) for ¥100 — tie bad fortunes to the rack nearby.",type:"sightseeing",mapQuery:"Senso-ji+Temple+Asakusa+Tokyo",highlight:!0},{time:"Mid-Morning",timeRange:"9:00 AM – 11:00 AM",icon:"🛒",title:"Nakamise Shopping Street",description:"Browse 89 traditional shops selling ningyo-yaki cakes, ningyo dolls, yukatas, and Japanese snacks. Perfect for omiyage (souvenir) shopping.",tips:"Try ningyo-yaki (red bean cake shaped like a doll) and kaminari-okoshi (rice crackers) — Asakusa specialties.",type:"shopping",mapQuery:"Nakamise+Dori+Asakusa"},{time:"Late Morning",timeRange:"11:00 AM – 12:00 PM",icon:"🔪",title:"Kappabashi Kitchen Town (合羽橋道具街)",description:"A 10-minute walk from Senso-ji brings you to Kappabashi Dori — 200+ professional kitchen supply shops. Browse gleaming knives, handmade ceramics, lacquerware, and hyper-realistic plastic food replicas (a Tokyo icon in themselves). Featured by Paolo from TOKYO and Abroad in Japan.",tips:"⭐ Paolo from TOKYO top pick. The plastic food replicas (sampuru) make hilarious gifts. A good Japanese kitchen knife from here starts at ¥3,000 and will last decades.",type:"shopping",mapQuery:"Kappabashi+Kitchen+Town+Tokyo",highlight:!0},{time:"Afternoon",timeRange:"12:00 PM – 3:00 PM",icon:"🗼",title:"Tokyo Skytree",description:"Ascend the world's tallest broadcast tower (634m). The Tembo Deck (350m) and Tembo Galleria (450m) offer breathtaking 360° views of Tokyo.",tips:"Book tickets online in advance to skip the queue. On clear days you can see Mt. Fuji to the west.",type:"sightseeing",mapQuery:"Tokyo+Skytree",highlight:!0},{time:"Afternoon",timeRange:"3:00 PM – 5:00 PM",icon:"🍡",title:"Lunch & Sumida River Walk",description:"Lunch at the Skytree mall (Solamachi) — over 300 shops and restaurants. Then take a scenic walk along the Sumida River.",tips:"Try a ramen or tempura set at Solamachi's 6th floor restaurant zone.",type:"dining"},{time:"Evening",timeRange:"6:00 PM – 9:00 PM",icon:"🍻",title:"Asahi Beer Hall & Hoppy Street",description:`Dine at one of Asakusa's famous izakayas on Hoppy Street. The golden "poo" sculpture atop the Asahi building is Tokyo's quirkiest landmark.`,tips:"Order hoppy (low-alcohol barley drink) and yakitori grilled skewers — Asakusa's local tradition since the 1940s.",type:"dining",mapQuery:"Hoppy+Street+Asakusa+Tokyo"}]},{id:3,date:"June 15",dayOfWeek:"Monday",theme:"Hakone Getaway — Day 1 (Overnight)",emoji:"🗻",color:"#3F6B5C",activities:[{time:"Early Morning",timeRange:"7:00 AM – 8:11 AM",icon:"🚄",title:"Depart for Hakone",description:"Pack an overnight bag and head to Shinjuku Station to board the Odakyu Romancecar bound for Hakone-Yumoto, departing at 8:11 AM. The reserved-seat limited express takes about 85 minutes through the mountains toward Mt. Fuji country.",tips:"Grab a coffee and an onigiri at the station before boarding — book the panoramic forward-facing seats up front if available.",type:"travel",mapQuery:"Shinjuku+Station+Odakyu+Romancecar",highlight:!0},{time:"Morning",timeRange:"9:36 AM – 9:45 AM",icon:"🧳",title:"Send Luggage Ahead — Station-to-Hotel Delivery",description:"The moment you arrive at Hakone-Yumoto Station, look for the luggage forwarding counter — it's in the station's main concourse near the Tourist Information desk, right by the entrance to the Hakone Tozan department store / souvenir plaza just outside the ticket gates. Hand over your overnight bags here for same-day delivery straight to Hoshino Resort KAI Hakone — they'll be waiting in your room by check-in time.",tips:"🧳 Don't skip this — it's a small fee per bag (roughly ¥500–1,000) and frees you to explore the museum, ropeway, and lake cruise hands-free all day. Keep a small day bag with anything you'll need before evening (camera, wallet, layers, swimsuit for the onsen, cash for snacks).",type:"travel",mapQuery:"Hakone+Yumoto+Station+Tourist+Information+Center",highlight:!0},{time:"Mid-Morning",timeRange:"9:45 AM – 11:30 AM",icon:"🎨",title:"Hakone Open-Air Museum (彫刻の森美術館)",description:"Japan's first open-air museum spreads Picasso, Henry Moore, and Japanese sculpture across forested hillside grounds, with a dedicated Picasso pavilion and a stained-glass Symphonic Sculpture tower you can climb.",tips:"A short walk from Chokoku-no-Mori Station (one stop from Hakone-Yumoto on the Hakone Tozan Line). Budget 1.5–2 hours; the open-air hot-spring foot bath inside is a nice mid-visit break.",type:"culture",mapQuery:"Hakone+Open+Air+Museum",highlight:!0},{time:"Late Morning",timeRange:"11:30 AM – 12:00 PM",icon:"🚞",title:"Hakone Tozan Train & Cable Car to Sounzan",description:"From Chokoku-no-Mori Station, continue on the Hakone Tozan Railway — Japan's oldest mountain railway, famous for its zig-zagging switchback turns up the forested slopes (and, by mid-to-late June, hydrangeas blooming right along the tracks). Ride it to the end of the line at Gora, then transfer directly to the Hakone Tozan Cable Car, a steep funicular that climbs from Gora up to Sounzan — your gateway to the ropeway and Owakudani.",tips:"🚞 Don't miss this pair — they're half the fun of getting around Hakone! Sit on the right side heading uphill for the best hydrangea views. The Hakone Free Pass covers the Tozan Train, Cable Car, Ropeway, and Pirate Ship cruise — get one at Hakone-Yumoto Station before you set off this morning.",type:"transport",mapQuery:"Hakone+Tozan+Railway+Gora+Station",highlight:!0},{time:"Midday",timeRange:"12:00 PM – 2:00 PM",icon:"🚡",title:"Owakudani via Hakone Ropeway",description:"Ride the Hakone Ropeway over the still-steaming Owakudani volcanic valley — sulfurous vents, an otherworldly grey landscape, and (on a clear day) Mt. Fuji rising in the distance. Stop for the famous kuro-tamago (black eggs), boiled in the hot springs and said to add seven years to your life.",tips:"Lunch here — the ropeway station has noodle shops with valley views. Eat one black egg per person — legend says each adds seven years to your life!",type:"highlight",mapQuery:"Owakudani+Hakone",highlight:!0},{time:"Afternoon",timeRange:"2:30 PM – 4:30 PM",icon:"⛴️",title:"Lake Ashi Pirate Ship Cruise & Hakone Shrine",description:`Continue down the ropeway to Togendai and board one of the replica "pirate ship" sightseeing boats across Lake Ashi to Hakone-machi. From there it's a short lakeside walk to Hakone Shrine's iconic red torii gate standing in the water — one of the most photographed views in Japan, with Mt. Fuji as backdrop on clear days.`,tips:"Sit on the upper deck for the best Fuji views. The shrine's lakeside torii is busiest at sunset — arrive a little earlier to get a clean shot before the crowds build.",type:"highlight",mapQuery:"Hakone+Shrine+Lake+Ashi",highlight:!0},{time:"Evening",timeRange:"5:30 PM – 7:00 PM",icon:"♨️",title:"Check-In at Hoshino Resort KAI Hakone & Onsen Soak",description:"Check into Hoshino Resort KAI Hakone, a modern ryokan along the Sukumogawa River known for its open-air baths and contemporary take on traditional hospitality, and unwind in its natural hot-spring onsen — Hakone is one of Japan's most famous hot-spring towns, fed by the same volcanic activity you saw at Owakudani.",tips:"Wash thoroughly before entering the bath. If you have tattoos, check KAI Hakone's policy ahead of time — you may need a private (kashikiri) bath.",type:"sightseeing",mapQuery:"Hoshino+Resort+KAI+Hakone"},{time:"Evening",timeRange:"7:30 PM – 9:00 PM",icon:"🍱",title:"Kaiseki Dinner & Overnight Stay",description:"KAI Hakone's multi-course kaiseki dinner is served in a private dining area — a parade of seasonal, beautifully plated dishes featuring local Hakone ingredients like Odawara seafood and mountain vegetables. Stay the night and wake up to mountain views over the river.",tips:"Wear your yukata (provided by the ryokan) to dinner — it's expected and part of the experience. Save room for the rice and dessert course at the end!",type:"dining",mapQuery:"Hoshino+Resort+KAI+Hakone+Kaiseki+Dinner",highlight:!0}]},{id:4,date:"June 16",dayOfWeek:"Tuesday",theme:"Hakone Morning & Return to Shinjuku",emoji:"🚄",color:"#1A3A6B",activities:[{time:"Morning",timeRange:"8:00 AM – 9:30 AM",icon:"🍵",title:"KAI Hakone Breakfast & Morning Onsen",description:"Start the day slowly with a traditional Japanese breakfast at Hoshino Resort KAI Hakone (grilled fish, rice, miso soup, pickles) and one more relaxed soak in the onsen before checking out.",tips:"Mornings are the quietest time at the baths — a great chance for one last soak before the day gets going.",type:"sightseeing",mapQuery:"Hoshino+Resort+KAI+Hakone"},{time:"Late Morning",timeRange:"10:00 AM – 12:00 PM",icon:"🌳",title:"Gora Park & Hakone Museum of Art",description:"A relaxed morning exploring Gora — a French-style garden with a tropical greenhouse and seasonal flowers — plus the moss-garden grounds of the Hakone Museum of Art. A gentle, scenic way to spend your last hours in the mountains.",tips:"The Hakone Tozan Cable Car connects Gora to the ropeway line — easy to combine on your way back toward Hakone-Yumoto.",type:"sightseeing",mapQuery:"Gora+Park+Hakone"},{time:"Midday",timeRange:"12:00 PM – 2:00 PM",icon:"🍜",title:"Lunch — Local Soba in Hakone-Yumoto",description:"Grab lunch in Hakone-Yumoto before heading back — the town is full of small soba and udon shops serving handmade noodles with local mountain vegetables and yuba (tofu skin), a regional specialty.",tips:"The main shopping street right by Hakone-Yumoto Station has plenty of casual noodle counters — perfect for a relaxed last meal in the mountains.",type:"dining",mapQuery:"Hakone+Yumoto+Soba+Restaurant"},{time:"Afternoon",timeRange:"2:00 PM – 5:00 PM",icon:"🛍️",title:"Hakone-Yumoto Souvenir Shopping & Last Soak",description:"Wander the souvenir shops along Hakone-Yumoto's main street for yosegi-zaiku (traditional marquetry woodwork), local sweets, and hot-spring bath salts. If your ryokan offers late checkout, sneak in one final onsen soak before the journey home.",tips:"Yosegi-zaiku puzzle boxes make great omiyage (gifts) — look for ones made in nearby Odawara, the craft's home region.",type:"shopping",mapQuery:"Hakone+Yumoto+Shopping+Street"},{time:"Late Afternoon",timeRange:"5:46 PM – 7:26 PM",icon:"🚄",title:"Romancecar Back to Shinjuku",description:"Board the Odakyu Romancecar departing Hakone-Yumoto at 5:46 PM, arriving at Shinjuku Station at 7:26 PM. Sit back and enjoy the mountain-to-city transition as Tokyo's skyline comes back into view.",tips:"Reserve your seat in advance for this leg — early-evening Romancecars back to Tokyo can fill up, especially on weekdays.",type:"travel",mapQuery:"Hakone+Yumoto+Station+Romancecar",highlight:!0},{time:"Evening",timeRange:"7:30 PM – 10:00 PM",icon:"🍶",title:"Dinner — Omoide Yokocho + Golden Gai",description:"Since you're already in Shinjuku, cap off the trip back with Omoide Yokocho (Memory Lane) — a cramped alley of yakitori stalls pouring smoke into the air since the 1940s — then Golden Gai: 200+ tiny bars (each seating ~5), each with its own theme and character. Chris Broad (Abroad in Japan) calls this his single favorite place in Tokyo.",tips:"⭐ Chris Broad's #1 pick in all of Japan. Golden Gai cover fees (¥500–1,000) are normal — ask before entering. Order a whisky highball, canned chu-hi, or local craft beer. Budget ¥1,500–2,500 per bar. From here it's about a 35-minute ride on the Marunouchi + Ginza Lines back to the hotel.",type:"dining",mapQuery:"Golden+Gai+Shinjuku+Tokyo",highlight:!0}]},{id:5,date:"June 17",dayOfWeek:"Wednesday",theme:"Yanaka Old Town & Akihabara",emoji:"🏮",color:"#2D6A4F",activities:[{time:"Morning",timeRange:"9:00 AM – 11:00 AM",icon:"🎨",title:"Tokyo National Museum (Ueno)",description:"Japan's largest and oldest national museum houses over 110,000 works. Highlights: samurai armor, ancient pottery, Buddhist sculptures, and ukiyo-e woodblock prints.",tips:"Focus on the Honkan (main building) for Japanese art and the Hyokeikan for ancient artifacts. ¥1,000 entry.",type:"culture",mapQuery:"Tokyo+National+Museum+Ueno",highlight:!0},{time:"Late Morning",timeRange:"11:00 AM – 12:30 PM",icon:"🏮",title:"Yanaka Ginza Shopping Street (谷中銀座)",description:"A 10-minute walk from Ueno takes you to Yanaka — Tokyo's best-preserved pre-war neighborhood. Yanaka Ginza is a 170m shopping street of small family shops selling traditional snacks, ceramics, and local crafts. The old cemetery, narrow alleys, and wooden houses feel like old-town Showa-era Japan. Featured extensively by Abroad in Japan and Tokyo Lens.",tips:'⭐ Abroad in Japan top pick for "real Tokyo." Try menchi-katsu (fried meat patty), taiyaki (fish-shaped cake), and fresh-cut melon. The area has almost zero tourists — very authentic.',type:"sightseeing",mapQuery:"Yanaka+Ginza+Tokyo",highlight:!0},{time:"Afternoon",timeRange:"1:00 PM – 4:00 PM",icon:"⚡",title:"Akihabara Electric Town",description:"Dive into Tokyo's otaku and electronics paradise. Multi-floor shops sell anime figures, retro games, manga, components, and gadgets. Yodobashi Camera is a 9-floor electronics megastore.",tips:"Visit a maid café for a uniquely Japanese experience (Anna Miller's or @Home Café are popular). Mandarake Complex has 8 floors of used anime/manga goods.",type:"shopping",mapQuery:"Akihabara+Tokyo",highlight:!0},{time:"Late Afternoon",timeRange:"4:00 PM – 5:00 PM",icon:"⌚",title:"Audemars Piguet — AP House Watch Lab (booked)",description:"Head back toward Ginza for your booked Watch Lab appointment at the Audemars Piguet AP House boutique — a guided, hands-on look at the craftsmanship and mechanics behind their watches, just minutes from the Grand Ginza Hotel.",tips:"📞 Confirm your exact appointment time and arrive a few minutes early. Since AP House is in Ginza (near the hotel), you may want to flip today's order — swing through here on the way out toward Ueno/Akihabara, or save it for the end of the day — to minimize backtracking.",type:"highlight",mapQuery:"Audemars+Piguet+AP+House+Ginza+Tokyo",highlight:!0},{time:"Late Afternoon",timeRange:"5:00 PM – 6:00 PM",icon:"🏮",title:"Ameya-Yokocho Market",description:"Wander this bustling open-air market under the JR tracks near Ueno Station. Originally a post-war black market, now packed with street food, clothing, and cosmetics.",tips:"Great for affordable Japanese snacks, dried seafood, and cheap cosmetics. Bargaining is sometimes possible.",type:"shopping",mapQuery:"Ameyoko+Market+Ueno+Tokyo"},{time:"Evening",timeRange:"6:30 PM – 9:00 PM",icon:"🍱",title:"Dinner — Tonkatsu Maisen or Ueno Izakaya",description:"Head to Maisen in Omotesando (famous tonkatsu since 1965) or enjoy an izakaya dinner with yakitori, karaage, and cold beer near Ueno.",tips:"If in the mood for budget dining, the side streets east of Ueno station have great izakayas around ¥2000–3000 per person with drinks.",type:"dining",mapQuery:"Tonkatsu+Maisen+Tokyo"}]},{id:6,date:"June 18",dayOfWeek:"Thursday",theme:"Day Trip — Kamakura",emoji:"🗿",color:"#5C4A00",activities:[{time:"Morning",timeRange:"7:30 AM – 9:30 AM",icon:"🚆",title:"Train to Kamakura",description:"Take the JR Yokosuka Line from Tokyo Station to Kamakura (about 1 hour). Purchase an Enoden 1-day pass at Kamakura Station for unlimited rides on the charming Enoshima Electric Railway.",tips:"Leave early to beat the crowds. The journey itself is scenic. Kamakura is about 50km south of Tokyo.",type:"transport",mapQuery:"Kamakura+Station"},{time:"Morning",timeRange:"9:30 AM – 11:00 AM",icon:"🗿",title:"Kotoku-in — The Great Buddha",description:"Stand before the 13.35m bronze Amida Buddha statue (1252 AD), one of Japan's most iconic images. You can enter the hollow statue for ¥20 extra.",tips:"The surrounding grounds are peaceful. Look for the sandals (donated by school children) displayed near the statue.",type:"sightseeing",mapQuery:"Kotoku-in+Great+Buddha+Kamakura",highlight:!0},{time:"Late Morning",timeRange:"11:00 AM – 12:30 PM",icon:"🌺",title:"Hase-dera Temple",description:"A short walk from the Buddha, this hillside temple has a 9.18m gilded wooden Kannon statue, a cave with hundreds of Jizo statues, and gorgeous views of Kamakura Bay.",tips:"The hydrangeas (ajisai) bloom in June — Hase-dera is one of the best spots in Japan to see them. Expect queues on weekends.",type:"sightseeing",mapQuery:"Hase-dera+Kamakura",highlight:!0},{time:"Afternoon",timeRange:"1:00 PM – 3:00 PM",icon:"⛩️",title:"Tsurugaoka Hachimangu Shrine",description:"Kamakura's most important Shinto shrine, founded in 1063. The grand approach (Dankazura) lined with cherry trees leads to the vermilion main hall.",tips:"The museum inside houses National Treasures from the Kamakura period. The pond has ducks and turtles.",type:"sightseeing",mapQuery:"Tsurugaoka+Hachimangu+Kamakura"},{time:"Afternoon",timeRange:"3:00 PM – 4:30 PM",icon:"🛍️",title:"Komachi Street Shopping",description:"Browse Kamakura's charming shopping street for local crafts, Buddhist goods, pickled plums, and matcha sweets.",tips:"Try shirasu-don (whitebait rice bowl) — Kamakura's local specialty, best at one of the many small restaurants on this street.",type:"shopping",mapQuery:"Komachi+Street+Kamakura"},{time:"Evening",timeRange:"5:30 PM – 7:00 PM",icon:"🚃",title:"Return to Tokyo",description:"Take the train back from Kamakura toward central Tokyo, leaving enough buffer to reach your dinner reservation in the city.",tips:"JR Yokosuka Line back to Tokyo Station runs ~55–60 minutes — budget extra time to transfer onward to your dinner spot.",type:"travel",mapQuery:"Kamakura+Station+to+Tokyo"},{time:"Evening",timeRange:"7:15 PM – 9:30 PM",icon:"🥩",title:"Dinner — Yoroniku (酔肉) (booked)",description:"Your reserved dinner tonight is at Yoroniku, one of Tokyo's most celebrated yakiniku restaurants — Michelin-starred, melt-in-your-mouth wagyu grilled tableside over charcoal, paired with expertly sourced sides and sauces. A true splurge-worthy finish to your Kamakura day.",tips:"📞 Reservation confirmed for 7:15 PM — arrive on time, as tables turn quickly. Dress neatly; this is one of the more refined dining experiences on the trip. Budget accordingly — premium wagyu omakase courses run well above typical yakiniku prices.",type:"dining",mapQuery:"Yoroniku+Tokyo",highlight:!0}]},{id:7,date:"June 19",dayOfWeek:"Friday",theme:"Odaiba & teamLab",emoji:"🤖",color:"#1A4A7A",activities:[{time:"Morning",timeRange:"9:00 AM – 10:30 AM",icon:"🌉",title:"Odaiba Waterfront",description:"Take the driverless Yurikamome monorail from Shimbashi over Rainbow Bridge to the futuristic artificial island of Odaiba. Walk the waterfront with views of the Rainbow Bridge and a replica Statue of Liberty.",tips:"The monorail ride itself is a highlight — sit at the front for a driver's-eye view. Buy a 1-day Yurikamome pass.",type:"sightseeing",mapQuery:"Odaiba+Tokyo",highlight:!0},{time:"Morning",timeRange:"10:30 AM – 12:00 PM",icon:"🚀",title:"teamLab Planets",description:"Immerse yourself in a digital art museum where you walk barefoot through expansive rooms filled with living flowers, crystal universes, and waterfall mirrors. One of Tokyo's most Instagram-worthy experiences.",tips:"BOOK TICKETS ONLINE IN ADVANCE — they sell out weeks ahead. Wear clothes you don't mind getting wet. The experience takes 1.5–2 hours.",type:"culture",mapQuery:"teamLab+Planets+Toyosu+Tokyo",highlight:!0},{time:"Afternoon",timeRange:"1:00 PM – 3:30 PM",icon:"🛍️",title:"DiverCity Tokyo & Gundam Statue",description:"Visit the life-size 18m RX-78 Gundam statue outside DiverCity mall. The mall has a Gundam Base Tokyo on the 7th floor with model kits and exclusive merchandise.",tips:"Even if you're not an anime fan, the Gundam statue is an incredible piece of engineering. Free to view from outside.",type:"sightseeing",mapQuery:"DiverCity+Gundam+Odaiba+Tokyo"},{time:"Late Afternoon",timeRange:"4:00 PM – 6:00 PM",icon:"🏖️",title:"Odaiba Beach & Toyota Mega Web",description:"Relax on Odaiba's man-made beach facing Tokyo Bay. Visit Toyota Mega Web (free!) to see concept cars and take test drives on a futuristic track.",tips:"The sunset view from Odaiba Beach with Rainbow Bridge and the Tokyo skyline as backdrop is spectacular.",type:"sightseeing",mapQuery:"Odaiba+Beach+Tokyo"},{time:"Evening",timeRange:"7:00 PM – 9:30 PM",icon:"🦞",title:"Dinner — Tsukiji Outer Market Area",description:"Head to the Tsukiji Outer Market area for fresh seafood dinner. Endless options for sushi, tamagoyaki (rolled omelette), and seafood rice bowls.",tips:"The outer market is open evenings. Sushi Dai and Daiwa Sushi are legendary (long queues, arrive early or late). Also try fresh oysters and grilled scallops at the stalls.",type:"dining",mapQuery:"Tsukiji+Outer+Market+Tokyo",highlight:!0}]},{id:8,date:"June 20",dayOfWeek:"Saturday",theme:"Farewell Day — Ginza & Departure",emoji:"🎌",color:"#4A1A1A",activities:[{time:"Morning",timeRange:"8:00 AM – 10:00 AM",icon:"☕",title:"Breakfast & Final Ginza Stroll",description:"Enjoy a final Japanese breakfast at the hotel or a nearby kissaten (traditional coffee house). Take one last walk around Ginza.",tips:"Try a morning set (morning teishoku) at a classic kissaten: toast, soft-boiled egg, and coffee for around ¥500.",type:"dining",mapQuery:"Ginza+Tokyo"},{time:"Morning",timeRange:"10:00 AM – 12:00 PM",icon:"✏️",title:"Last-Minute Shopping — Itoya & Ginza Six",description:"Itoya stationery (12 floors!) for Japanese notebooks, washi tape, and pens. Ginza Six for luxury omiyage (gifts): Kyoto Isogiku tea, Shiroi Koibito cookies, Tokyo Banana.",tips:"Tax-free shopping (免税) is available for purchases over ¥5000 at most department stores. Bring your passport.",type:"shopping",mapQuery:"Itoya+Ginza+Tokyo"},{time:"Midday",timeRange:"12:00 PM – 1:00 PM",icon:"🍱",title:"Farewell Lunch",description:"A proper farewell meal — try tempura at Tenichi (a Ginza institution since 1930) or a set lunch at one of Ginza's high-end restaurants at affordable lunch prices.",tips:"Many Michelin-starred Ginza restaurants offer lunch sets for ¥3000–5000 that would cost ¥20,000+ at dinner. Last chance!",type:"dining",mapQuery:"Tenichi+Ginza+Tokyo",highlight:!0},{time:"Afternoon",timeRange:"1:30 PM – 3:30 PM",icon:"🏨",title:"Hotel Checkout & Luggage",description:"Check out from Grand Ginza Hotel. Most hotels allow you to store luggage after checkout — arrange this if your flight is in the evening.",tips:"You can also ship luggage (takuhaibin) directly to the airport via Yamato Transport (¥1500–2000 per bag, needs to be arranged the previous day).",type:"transport",mapQuery:"Grand+Ginza+Hotel+Tokyo"},{time:"Late Afternoon",timeRange:"4:00 PM – 6:00 PM",icon:"🚆",title:"Transfer to Narita Airport",description:"Head to Narita Airport (NRT) via the Narita Express (N'EX, ~60 min from Tokyo/Shinjuku Station) or the Keisei Skyliner (~40 min from Ueno) for your onward flight to Taipei, Taiwan. Allow at least 3 hours before an international departure.",tips:"Load remaining Suica card balance onto your phone before departure — Suica on Apple/Google Pay works internationally! Or surrender the card at the station for a ¥500 deposit refund.",type:"transport",mapQuery:"Narita+International+Airport"},{time:"Evening",timeRange:"6:00 PM onward",icon:"✈️",title:"Departure — Tokyo (NRT) → Taipei (TPE)",description:"Board your flight from Tokyo Narita to Taipei, Taiwan — the next stop on your trip! Sayonara Tokyo, and 你好 Taipei — incredible memories of Tokyo's endless energy, kindness, food, and culture come along with you.",tips:"Check in for your Narita → Taipei flight at least 3 hours early for international departure. Confirm whether you need to surrender your IC card for a deposit refund, and grab one last conbini (convenience store) snack run before
